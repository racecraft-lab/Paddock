# GitHub secret-scanning + push-protection exclusions.
#
# The `src/lib/__tests__/__fixtures__/secrets/` directory contains synthetic
# test fixtures used to validate the SPEC-007 MC Secret Detector v1
# (`src/lib/secret-detector.ts`). Every line is hand-authored test data —
# never derived from real customer secrets — but the patterns intentionally
# match the regex shape of real secrets (Stripe `sk_live_…`, Slack `xox?-…`,
# AWS `AKIA…`, etc.) because that is what the detector under test must catch.
#
# Excluding this single directory from secret-scanning + push-protection
# preserves the existing detector test coverage (per-rule positive/negative
# fixtures + wild-corpus recall ≥ 0.95) without forcing GitHub's scanner to
# treat synthetic test data as live secrets.
#
# Per FR-031, FR-035, and the SPEC-007 Spec Evidence section: fixtures MUST
# be synthetic + manually crafted; never real customer data.
paths-ignore:
  - "src/lib/__tests__/__fixtures__/secrets/**"
