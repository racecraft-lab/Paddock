name: Argos Storybook Visuals

on:
  pull_request:
    paths:
      - '.github/workflows/argos-storybook.yml'
      - '.storybook/**'
      - 'src/**/*.stories.tsx'
      - 'src/components/layout/**'
      - 'src/components/panels/orchestration-bar.tsx'
      - 'src/components/panels/task-board-panel.tsx'
      - 'src/components/panels/notifications-panel.tsx'
      - 'src/components/settings/**'
      - 'src/components/ui/**'
      - 'src/store/**'
      - 'src/types/product-line.ts'
      - 'src/types/workflow-template.ts'
      - 'src/lib/feature-flags.ts'
      - 'messages/en.json'
      - 'src/app/globals.css'
      - 'tailwind.config.js'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'vitest.storybook.config.ts'
      - 'scripts/verify-argos-metadata.mjs'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/argos-storybook.yml'
      - '.storybook/**'
      - 'src/**/*.stories.tsx'
      - 'src/components/layout/**'
      - 'src/components/panels/orchestration-bar.tsx'
      - 'src/components/panels/task-board-panel.tsx'
      - 'src/components/panels/notifications-panel.tsx'
      - 'src/components/settings/**'
      - 'src/components/ui/**'
      - 'src/store/**'
      - 'src/types/product-line.ts'
      - 'src/types/workflow-template.ts'
      - 'src/lib/feature-flags.ts'
      - 'messages/en.json'
      - 'src/app/globals.css'
      - 'tailwind.config.js'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'vitest.storybook.config.ts'
      - 'scripts/verify-argos-metadata.mjs'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  argos-storybook:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Storybook visual tests
        id: storybook
        continue-on-error: true
        env:
          ARGOS_TOKEN: ${{ secrets.ARGOS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARGOS_UPLOAD_TO_ARGOS: '0'
        run: pnpm test:visual:storybook

      - name: Verify Argos Storybook metadata
        id: storybook-metadata
        if: always()
        continue-on-error: true
        env:
          ARGOS_STORYBOOK_EXPECTED_METADATA: '160'
          ARGOS_STORYBOOK_EXPECTED_STORIES: '140'
          ARGOS_STORYBOOK_REQUIRED_TAGS: 'visual'
          ARGOS_STORYBOOK_REQUIRED_DOMAIN_STORY_COUNTS: 'product-line-switcher:8,feature-flag-admin:2,task-pipeline-workflows:2,ready-for-owner:3,spec-007:3,spec-008:120'
        run: pnpm test:visual:argos-metadata

      - name: Fail on Storybook or Argos metadata defects
        if: steps.storybook.outcome != 'success' || steps.storybook-metadata.outcome != 'success'
        run: exit 1
