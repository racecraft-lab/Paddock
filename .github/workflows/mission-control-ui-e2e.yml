name: Paddock UI E2E

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/mission-control-ui-e2e.yml'
      - 'src/components/layout/**'
      - 'src/components/panels/orchestration-bar.tsx'
      - 'src/components/panels/task-board-panel.tsx'
      - 'src/components/panels/notifications-panel.tsx'
      - 'src/components/settings/**'
      - 'src/components/ui/theme-selector.tsx'
      - 'src/store/**'
      - 'src/types/product-line.ts'
      - 'src/lib/feature-flags.ts'
      - 'src/lib/workspaces.ts'
      - 'src/app/api/**'
      - 'tests/product-line-*.spec.ts'
      - 'tests/feature-flags-*.spec.ts'
      - 'tests/e2e/feature-flag-matrix.e2e.ts'
      - 'tests/e2e/governance-*.e2e.ts'
      - 'tests/e2e/governance-*.spec.ts'
      - 'tests/e2e/ready-for-owner-kanban.spec.ts'
      - 'tests/e2e/spec-007-ui-visual.spec.ts'
      - 'tests/e2e/spec-013a-task-stage-attempts.spec.ts'
      - 'tests/e2e/spec-008/**'
      - 'tests/e2e/workflow-contract-diagnostics.spec.ts'
      - 'tests/e2e/fixtures/workflow-contract-diagnostics.ts'
      - 'tests/workspace-switcher-*.spec.ts'
      - 'tests/helpers.ts'
      - 'scripts/e2e-docker.sh'
      - 'scripts/seed-e2e-workspace-switcher.cjs'
      - 'scripts/seed-e2e-spec-007.cjs'
      - 'scripts/seed-e2e-spec-008.cjs'
      - 'scripts/seed-spec-007.ts'
      - 'scripts/clean-visual-output.mjs'
      - 'scripts/verify-visual-manifest.mjs'
      - 'tests/visual/**'
      - 'regconfig*.json'
      - 'playwright*.config.ts'
      - 'Dockerfile'
      - 'docker-entrypoint.sh'
      - 'package.json'
      - 'pnpm-lock.yaml'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/mission-control-ui-e2e.yml'
      - 'src/components/layout/**'
      - 'src/components/panels/orchestration-bar.tsx'
      - 'src/components/panels/task-board-panel.tsx'
      - 'src/components/panels/notifications-panel.tsx'
      - 'src/components/settings/**'
      - 'src/components/ui/theme-selector.tsx'
      - 'src/store/**'
      - 'src/types/product-line.ts'
      - 'src/lib/feature-flags.ts'
      - 'src/lib/workspaces.ts'
      - 'src/app/api/**'
      - 'tests/product-line-*.spec.ts'
      - 'tests/feature-flags-*.spec.ts'
      - 'tests/e2e/feature-flag-matrix.e2e.ts'
      - 'tests/e2e/governance-*.e2e.ts'
      - 'tests/e2e/governance-*.spec.ts'
      - 'tests/e2e/ready-for-owner-kanban.spec.ts'
      - 'tests/e2e/spec-007-ui-visual.spec.ts'
      - 'tests/e2e/spec-013a-task-stage-attempts.spec.ts'
      - 'tests/e2e/spec-008/**'
      - 'tests/e2e/workflow-contract-diagnostics.spec.ts'
      - 'tests/e2e/fixtures/workflow-contract-diagnostics.ts'
      - 'tests/workspace-switcher-*.spec.ts'
      - 'tests/helpers.ts'
      - 'scripts/e2e-docker.sh'
      - 'scripts/seed-e2e-workspace-switcher.cjs'
      - 'scripts/seed-e2e-spec-007.cjs'
      - 'scripts/seed-e2e-spec-008.cjs'
      - 'scripts/seed-spec-007.ts'
      - 'scripts/clean-visual-output.mjs'
      - 'scripts/verify-visual-manifest.mjs'
      - 'tests/visual/**'
      - 'regconfig*.json'
      - 'playwright*.config.ts'
      - 'Dockerfile'
      - 'docker-entrypoint.sh'
      - 'package.json'
      - 'pnpm-lock.yaml'

concurrency:
  group: visual-regression-pages-playwright-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: read
  issues: write
  pull-requests: write
  statuses: write

jobs:
  docker-ui-e2e:
    uses: racecraft-lab/visual-review-pages/.github/workflows/visual-review-report.yml@main
    with:
      surface: playwright
      surface_label: Playwright UI E2E
      project_name: Paddock
      visual_test_command: >-
        MC_VISUAL_SNAPSHOTS=1
        MC_VISUAL_OUTPUT_DIR=test-results/visual-current
        SPEC_008_AXE_ENABLED=1
        pnpm test:e2e:docker
      manifest_command: >-
        MC_VISUAL_PLAYWRIGHT_EXPECTED_SNAPSHOTS=142
        MC_VISUAL_PLAYWRIGHT_EXPECTED_TESTS=102
        MC_VISUAL_PLAYWRIGHT_ALLOWED_TEST_TAGS=@product-line-switcher,@feature-flag-admin,@ready-for-owner,@spec-007,@spec-008,@spec-013a,@workflow-contracts
        MC_VISUAL_PLAYWRIGHT_ALLOWED_SNAPSHOT_TAGS=product-line-switcher,feature-flag-admin,ready-for-owner,spec-007,spec-008,spec-013a,workflow-contracts
        MC_VISUAL_PLAYWRIGHT_REQUIRED_DOMAIN_COUNTS=product-line-switcher:9,feature-flag-admin:2,ready-for-owner:3,spec-007:5,spec-008:120,spec-013a:1,workflow-contracts:1
        pnpm test:e2e:visual-manifest
      image_directory_path: test-results/visual-current/playwright
      manifest_dir: test-results/visual-current/playwright
      report_file_path: test-results/visual-report/playwright.html
      artifact_name: mission-control-ui-e2e-artifacts
      artifact_paths: |
        repo/test-results/
        repo/playwright-report/
      workflow_file: mission-control-ui-e2e.yml
      pages_branch: visual-regression-pages
      base_url: https://racecraft-lab.github.io/Paddock
      package_manager: pnpm
      pnpm_version: '10'
      node_version: '22'
      visual_review_ref: main
      review_domains: auto
      suppress_reg_viz_comments: true
    secrets:
      visual_review_pages_deploy_key: ${{ secrets.VISUAL_REGRESSION_PAGES_DEPLOY_KEY }}
