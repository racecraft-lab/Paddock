name: Mission Control UI E2E

on:
  pull_request:
    paths:
      - '.github/workflows/mission-control-ui-e2e.yml'
      - 'src/components/layout/**'
      - 'src/components/panels/task-board-panel.tsx'
      - 'src/components/panels/notifications-panel.tsx'
      - 'src/components/settings/**'
      - 'src/components/ui/theme-selector.tsx'
      - 'src/store/**'
      - 'src/types/product-line.ts'
      - 'src/lib/feature-flags.ts'
      - 'src/lib/workspaces.ts'
      - 'src/app/api/**'
      - 'tests/product-line-*.spec.ts'
      - 'tests/feature-flags-*.spec.ts'
      - 'tests/e2e/feature-flag-matrix.e2e.ts'
      - 'tests/e2e/governance-*.e2e.ts'
      - 'tests/e2e/governance-*.spec.ts'
      - 'tests/e2e/ready-for-owner-kanban.spec.ts'
      - 'tests/e2e/spec-007-ui-visual.spec.ts'
      - 'tests/e2e/spec-008/**'
      - 'tests/workspace-switcher-*.spec.ts'
      - 'tests/helpers.ts'
      - 'scripts/e2e-docker.sh'
      - 'scripts/seed-e2e-workspace-switcher.cjs'
      - 'scripts/seed-e2e-spec-007.cjs'
      - 'scripts/seed-e2e-spec-008.cjs'
      - 'scripts/seed-spec-007.ts'
      - 'scripts/clean-visual-output.mjs'
      - 'scripts/verify-visual-manifest.mjs'
      - 'tests/visual/**'
      - 'regconfig*.json'
      - 'playwright*.config.ts'
      - 'Dockerfile'
      - 'docker-entrypoint.sh'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.specify/memory/constitution.md'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/mission-control-ui-e2e.yml'
      - 'src/components/layout/**'
      - 'src/components/panels/task-board-panel.tsx'
      - 'src/components/panels/notifications-panel.tsx'
      - 'src/components/settings/**'
      - 'src/components/ui/theme-selector.tsx'
      - 'src/store/**'
      - 'src/types/product-line.ts'
      - 'src/lib/feature-flags.ts'
      - 'src/lib/workspaces.ts'
      - 'src/app/api/**'
      - 'tests/product-line-*.spec.ts'
      - 'tests/feature-flags-*.spec.ts'
      - 'tests/e2e/feature-flag-matrix.e2e.ts'
      - 'tests/e2e/governance-*.e2e.ts'
      - 'tests/e2e/governance-*.spec.ts'
      - 'tests/e2e/ready-for-owner-kanban.spec.ts'
      - 'tests/e2e/spec-007-ui-visual.spec.ts'
      - 'tests/e2e/spec-008/**'
      - 'tests/workspace-switcher-*.spec.ts'
      - 'tests/helpers.ts'
      - 'scripts/e2e-docker.sh'
      - 'scripts/seed-e2e-workspace-switcher.cjs'
      - 'scripts/seed-e2e-spec-007.cjs'
      - 'scripts/seed-e2e-spec-008.cjs'
      - 'scripts/seed-spec-007.ts'
      - 'scripts/clean-visual-output.mjs'
      - 'scripts/verify-visual-manifest.mjs'
      - 'tests/visual/**'
      - 'regconfig*.json'
      - 'playwright*.config.ts'
      - 'Dockerfile'
      - 'docker-entrypoint.sh'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.specify/memory/constitution.md'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: write
  actions: read
  issues: write
  pull-requests: write

jobs:
  docker-ui-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Docker-backed Mission Control UI journey
        id: e2e
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MC_VISUAL_SNAPSHOTS: '1'
          MC_VISUAL_OUTPUT_DIR: test-results/visual-current
          SPEC_008_AXE_ENABLED: '1'
        run: pnpm test:e2e:docker

      - name: Verify Playwright visual manifests
        id: visual-manifest
        if: always()
        continue-on-error: true
        env:
          MC_VISUAL_PLAYWRIGHT_EXPECTED_SNAPSHOTS: '140'
          MC_VISUAL_PLAYWRIGHT_EXPECTED_TESTS: '100'
          MC_VISUAL_PLAYWRIGHT_ALLOWED_TEST_TAGS: '@product-line-switcher,@feature-flag-admin,@ready-for-owner,@spec-007,@spec-008'
          MC_VISUAL_PLAYWRIGHT_ALLOWED_SNAPSHOT_TAGS: 'product-line-switcher,feature-flag-admin,ready-for-owner,spec-007,spec-008'
          MC_VISUAL_PLAYWRIGHT_REQUIRED_DOMAIN_COUNTS: 'product-line-switcher:9,feature-flag-admin:2,ready-for-owner:3,spec-007:5,spec-008:120'
        run: pnpm test:e2e:visual-manifest

      - name: Prepare Playwright visual report directory
        if: steps.e2e.outcome == 'success' && steps.visual-manifest.outcome == 'success'
        run: mkdir -p test-results/visual-report

      - name: Compare Playwright visual snapshots
        id: visual-regression
        if: steps.e2e.outcome == 'success' && steps.visual-manifest.outcome == 'success'
        continue-on-error: true
        uses: reg-viz/reg-actions@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          image-directory-path: test-results/visual-current/playwright
          artifact-name: mission-control-playwright-visual
          branch: visual-regression-artifacts
          report-file-path: test-results/visual-report/playwright.html
          comment-report-format: summarized
          outdated-comment-action: minimize
          retention-days: 30

      - name: Publish Playwright visual report to GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.e2e.outcome == 'success' && steps.visual-manifest.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm visual:reg-suit:playwright

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mission-control-ui-e2e-artifacts
          path: |
            test-results/
            playwright-report/docker/
          if-no-files-found: ignore
          retention-days: 14

      - name: Comment with screenshot review artifact
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const marker = '<!-- mission-control-ui-e2e -->';
            const outcome = '${{ steps.e2e.outcome }}';
            const metadataOutcome = '${{ steps.visual-manifest.outcome }}';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              marker,
              `Mission Control Docker-backed UI journey: **${outcome}**`,
              `Playwright visual manifest gate: **${metadataOutcome}**`,
              '',
              `Review screenshots and traces in the \`mission-control-ui-e2e-artifacts\` artifact: ${runUrl}`,
              '',
              'Visual manifest gate: CI must find at least 140 Playwright visual snapshots across 100 tests, including at least 120 SPEC-008 governance screenshots, before this check can pass.',
              '',
              'Covered states: Facility task board, scope menu options, selected Product Line task board, Facility aggregate return, keyboard listbox focus, 320/375/390 px mobile scope menus, cross-tab Product Line sync, Feature Flags admin default/toggle states, Ready for Owner states, SPEC-007 visual states, and SPEC-008 governance journeys for WIP policy, budgets, windows, overrides, diagnostics, dispatch feed, system health, recovery modals, calibration, Aegis reserve, feature-flag matrix, and all-flags-on baseline.'
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number, per_page: 100 });
            const existing = comments.data.find((comment) => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Fail on E2E, visual manifest, or visual regression defects
        if: steps.e2e.outcome != 'success' || steps.visual-manifest.outcome != 'success' || steps.visual-regression.outcome == 'failure'
        run: exit 1
