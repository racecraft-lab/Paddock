name: Mission Control UI E2E

on:
  pull_request:
    paths:
      - '.github/workflows/mission-control-ui-e2e.yml'
      - 'src/components/layout/**'
      - 'src/components/settings/**'
      - 'src/components/ui/theme-selector.tsx'
      - 'src/store/**'
      - 'src/types/product-line.ts'
      - 'src/lib/feature-flags.ts'
      - 'src/lib/workspaces.ts'
      - 'src/app/api/**'
      - 'tests/product-line-*.spec.ts'
      - 'tests/feature-flags-*.spec.ts'
      - 'tests/workspace-switcher-*.spec.ts'
      - 'tests/helpers.ts'
      - 'scripts/e2e-docker.sh'
      - 'scripts/seed-e2e-workspace-switcher.cjs'
      - 'scripts/verify-argos-test-metadata.mjs'
      - 'playwright*.config.ts'
      - 'Dockerfile'
      - 'docker-entrypoint.sh'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.specify/memory/constitution.md'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/mission-control-ui-e2e.yml'
      - 'src/components/layout/**'
      - 'src/components/settings/**'
      - 'src/components/ui/theme-selector.tsx'
      - 'src/store/**'
      - 'src/types/product-line.ts'
      - 'src/lib/feature-flags.ts'
      - 'src/lib/workspaces.ts'
      - 'src/app/api/**'
      - 'tests/product-line-*.spec.ts'
      - 'tests/feature-flags-*.spec.ts'
      - 'tests/workspace-switcher-*.spec.ts'
      - 'tests/helpers.ts'
      - 'scripts/e2e-docker.sh'
      - 'scripts/seed-e2e-workspace-switcher.cjs'
      - 'scripts/verify-argos-test-metadata.mjs'
      - 'playwright*.config.ts'
      - 'Dockerfile'
      - 'docker-entrypoint.sh'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.specify/memory/constitution.md'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: read
  actions: read
  issues: write
  pull-requests: write

jobs:
  docker-ui-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Docker-backed Mission Control UI journey
        id: e2e
        continue-on-error: true
        env:
          ARGOS_TOKEN: ${{ secrets.ARGOS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARGOS_UPLOAD_TO_ARGOS: '1'
          ARGOS_PLAYWRIGHT_SCREENSHOTS: '1'
          ARGOS_PLAYWRIGHT_TRACES: '1'
        run: pnpm test:e2e:docker

      - name: Verify Argos test metadata
        id: argos-metadata
        if: always()
        continue-on-error: true
        env:
          ARGOS_PLAYWRIGHT_EXPECTED_METADATA: '11'
          ARGOS_PLAYWRIGHT_EXPECTED_TESTS: '5'
          ARGOS_PLAYWRIGHT_ALLOWED_TEST_TAGS: '@product-line-switcher,@feature-flag-admin'
          ARGOS_PLAYWRIGHT_ALLOWED_SCREENSHOT_TAGS: 'product-line-switcher,feature-flag-admin'
          ARGOS_PLAYWRIGHT_REQUIRED_DOMAIN_COUNTS: 'product-line-switcher:9,feature-flag-admin:2'
        run: pnpm test:e2e:argos-metadata

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mission-control-ui-e2e-artifacts
          path: |
            test-results/
            playwright-report/docker/
          if-no-files-found: ignore
          retention-days: 14

      - name: Comment with screenshot review artifact
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const marker = '<!-- mission-control-ui-e2e -->';
            const outcome = '${{ steps.e2e.outcome }}';
            const metadataOutcome = '${{ steps.argos-metadata.outcome }}';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              marker,
              `Mission Control Docker-backed UI journey: **${outcome}**`,
              `Argos Playwright test metadata gate: **${metadataOutcome}**`,
              '',
              `Review screenshots and traces in the \`mission-control-ui-e2e-artifacts\` artifact: ${runUrl}`,
              '',
              'Argos metadata gate: CI must find at least 11 Argos screenshot metadata files across 5 Playwright tests with Product Line switcher and Feature Flag admin domain tags before this check can pass.',
              '',
              'Covered states: Facility task board, scope menu options, selected Product Line task board, Facility aggregate return, keyboard listbox focus, 320/375/390 px mobile scope menus, cross-tab Product Line sync, Feature Flags admin default state, and Feature Flags admin toggle-on state.'
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number, per_page: 100 });
            const existing = comments.data.find((comment) => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Fail on E2E or Argos metadata defects
        if: steps.e2e.outcome != 'success' || steps.argos-metadata.outcome != 'success'
        run: exit 1
