name: Visual Approval

on:
  pull_request:
  issue_comment:
    types:
      - created
      - edited
      - deleted
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to recheck
        required: true

permissions:
  contents: read
  issues: read
  pull-requests: read
  statuses: write

jobs:
  storybook-approval:
    uses: racecraft-lab/visual-review-pages/.github/workflows/visual-review-approval.yml@main
    with:
      pr_number: ${{ github.event_name == 'workflow_dispatch' && inputs.pr_number || '' }}
      required_surfaces: storybook
      context: visual-review-approval/storybook
      visual_review_paths: >-
        .storybook/**,
        messages/en.json,
        package.json,
        pnpm-lock.yaml,
        regconfig*.json,
        scripts/clean-visual-output.mjs,
        scripts/verify-visual-manifest.mjs,
        scripts/write-storybook-visual-manifests.mjs,
        src/**/*.stories.tsx,
        src/app/globals.css,
        src/components/layout/**,
        src/components/panels/notifications-panel.tsx,
        src/components/panels/orchestration-bar.tsx,
        src/components/panels/task-board-panel.tsx,
        src/components/settings/**,
        src/components/ui/**,
        src/lib/feature-flags.ts,
        src/store/**,
        src/types/product-line.ts,
        src/types/workflow-template.ts,
        tailwind.config.js,
        vitest.storybook.config.ts
      node_version: '22'

  playwright-approval:
    uses: racecraft-lab/visual-review-pages/.github/workflows/visual-review-approval.yml@main
    with:
      pr_number: ${{ github.event_name == 'workflow_dispatch' && inputs.pr_number || '' }}
      required_surfaces: playwright
      context: visual-review-approval/playwright
      visual_review_paths: >-
        .storybook/**,
        Dockerfile,
        docker-entrypoint.sh,
        messages/en.json,
        package.json,
        playwright*.config.ts,
        pnpm-lock.yaml,
        regconfig*.json,
        scripts/clean-visual-output.mjs,
        scripts/e2e-docker.sh,
        scripts/seed-e2e-spec-007.cjs,
        scripts/seed-e2e-spec-008.cjs,
        scripts/seed-e2e-workspace-switcher.cjs,
        scripts/seed-spec-007.ts,
        scripts/verify-visual-manifest.mjs,
        scripts/write-storybook-visual-manifests.mjs,
        src/**/*.stories.tsx,
        src/app/api/**,
        src/app/globals.css,
        src/components/layout/**,
        src/components/panels/notifications-panel.tsx,
        src/components/panels/orchestration-bar.tsx,
        src/components/panels/task-board-panel.tsx,
        src/components/settings/**,
        src/components/ui/**,
        src/lib/feature-flags.ts,
        src/lib/workspaces.ts,
        src/store/**,
        src/types/product-line.ts,
        src/types/workflow-template.ts,
        tailwind.config.js,
        tests/e2e/feature-flag-matrix.e2e.ts,
        tests/e2e/governance-*.e2e.ts,
        tests/e2e/governance-*.spec.ts,
        tests/e2e/ready-for-owner-kanban.spec.ts,
        tests/e2e/spec-007-ui-visual.spec.ts,
        tests/e2e/spec-008/**,
        tests/e2e/workflow-contract-diagnostics.spec.ts,
        tests/e2e/fixtures/workflow-contract-diagnostics.ts,
        tests/feature-flags-*.spec.ts,
        tests/helpers.ts,
        tests/product-line-*.spec.ts,
        tests/visual/**,
        tests/workspace-switcher-*.spec.ts,
        vitest.storybook.config.ts
      node_version: '22'
