name: Visual Storybook Snapshots

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/visual-storybook.yml'
      - '.storybook/**'
      - 'src/**/*.stories.tsx'
      - 'src/components/layout/**'
      - 'src/components/panels/orchestration-bar.tsx'
      - 'src/components/panels/task-board-panel.tsx'
      - 'src/components/panels/notifications-panel.tsx'
      - 'src/components/settings/**'
      - 'src/components/ui/**'
      - 'src/store/**'
      - 'src/types/product-line.ts'
      - 'src/types/workflow-template.ts'
      - 'src/lib/feature-flags.ts'
      - 'messages/en.json'
      - 'src/app/globals.css'
      - 'tailwind.config.js'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'vitest.storybook.config.ts'
      - 'scripts/clean-visual-output.mjs'
      - 'scripts/write-storybook-visual-manifests.mjs'
      - 'scripts/verify-visual-manifest.mjs'
      - 'regconfig*.json'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/visual-storybook.yml'
      - '.storybook/**'
      - 'src/**/*.stories.tsx'
      - 'src/components/layout/**'
      - 'src/components/panels/orchestration-bar.tsx'
      - 'src/components/panels/task-board-panel.tsx'
      - 'src/components/panels/notifications-panel.tsx'
      - 'src/components/settings/**'
      - 'src/components/ui/**'
      - 'src/store/**'
      - 'src/types/product-line.ts'
      - 'src/types/workflow-template.ts'
      - 'src/lib/feature-flags.ts'
      - 'messages/en.json'
      - 'src/app/globals.css'
      - 'tailwind.config.js'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'vitest.storybook.config.ts'
      - 'scripts/clean-visual-output.mjs'
      - 'scripts/write-storybook-visual-manifests.mjs'
      - 'scripts/verify-visual-manifest.mjs'
      - 'regconfig*.json'

concurrency:
  group: visual-regression-pages-storybook-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: read
  issues: write
  pull-requests: write
  statuses: write

jobs:
  visual-storybook:
    uses: racecraft-lab/visual-review-pages/.github/workflows/visual-review-report.yml@main
    with:
      surface: storybook
      surface_label: Storybook Components
      project_name: Mission Control
      visual_test_command: >-
        STORYBOOK_DISABLE_TELEMETRY=1
        MC_VISUAL_OUTPUT_DIR=test-results/visual-current
        pnpm test:visual:storybook
      manifest_command: >-
        MC_VISUAL_STORYBOOK_EXPECTED_SNAPSHOTS=153
        MC_VISUAL_STORYBOOK_EXPECTED_STORIES=153
        MC_VISUAL_STORYBOOK_REQUIRED_TAGS=visual
        MC_VISUAL_STORYBOOK_REQUIRED_DOMAIN_STORY_COUNTS=product-line-switcher:8,feature-flag-admin:2,task-pipeline-workflows:2,workflow-contracts:1,ready-for-owner:3,spec-007:3,spec-008:120
        pnpm test:visual:manifest
      image_directory_path: test-results/visual-current/storybook
      manifest_dir: test-results/visual-current/storybook
      report_file_path: test-results/visual-report/storybook.html
      artifact_name: mission-control-storybook-visual
      artifact_paths: |
        repo/test-results/
        repo/playwright-report/
      workflow_file: visual-storybook.yml
      pages_branch: visual-regression-pages
      base_url: https://racecraft-lab.github.io/mission-control
      package_manager: pnpm
      pnpm_version: '10'
      node_version: '22'
      visual_review_ref: main
      review_domains: auto
      suppress_reg_viz_comments: true
      timeout_minutes: 20
    secrets:
      visual_review_pages_deploy_key: ${{ secrets.VISUAL_REGRESSION_PAGES_DEPLOY_KEY }}
