# Canonical reviewed seed config for the Paddock product line.
# This file declares configuration intent only; apply/verify behavior is owned by the seeder command.
schema_version: product-line-seed-v1
product_line:
  slug: paddock
  display_name: Paddock
  agent_prefix: paddock-platform
github:
  owner: racecraft-lab
  repo: Paddock
  full_name: racecraft-lab/Paddock
workflow_contract:
  family: paddock
  path: docs/ai/workflows/paddock/workflow-contract.yaml
  required_slugs:
    - paddock_issue_triage
    - paddock_specialist_route
    - paddock_close_issue
    - paddock_needs_spec_route
    - paddock_remediation_plan
    - paddock_dev_implementation
    - paddock_review
    - paddock_owner_review
    - paddock_aegis
departments:
  - slug: qa
    name: QA
    ticket_prefix: QA
    area_slug: qa
    github_repo: racecraft-lab/Paddock
    github_sync_enabled: true
    is_triage_project: true
    is_repo_sync_owner: true
  - slug: development
    name: Development
    ticket_prefix: DEV
    area_slug: dev
    github_repo: null
    github_sync_enabled: false
    is_triage_project: false
    is_repo_sync_owner: false
  - slug: devsecops
    name: DevSecOps
    ticket_prefix: SEC
    area_slug: devsecops
    github_repo: null
    github_sync_enabled: false
    is_triage_project: false
    is_repo_sync_owner: false
  - slug: marketing
    name: Marketing
    ticket_prefix: MKT
    area_slug: marketing
    github_repo: null
    github_sync_enabled: false
    is_triage_project: false
    is_repo_sync_owner: false
  - slug: customer-service
    name: Customer Service
    ticket_prefix: CS
    area_slug: customer-service
    github_repo: null
    github_sync_enabled: false
    is_triage_project: false
    is_repo_sync_owner: false
  - slug: finance
    name: Finance
    ticket_prefix: FIN
    area_slug: finance
    github_repo: null
    github_sync_enabled: false
    is_triage_project: false
    is_repo_sync_owner: false
agent_assignments:
  product_line_assignments:
    - agent_key: research
      role: researcher
      department_slug: qa
    - agent_key: planner
      role: planner
      department_slug: qa
    - agent_key: dev
      role: dev
      department_slug: development
    - agent_key: ui
      role: ui
      department_slug: development
    - agent_key: devsecops
      role: devsecops
      department_slug: devsecops
    - agent_key: qa
      role: qa
      department_slug: qa
feature_flags:
  enabled:
    - FEATURE_WORKSPACE_SWITCHER
    - FEATURE_GLOBAL_AEGIS
    - FEATURE_TASK_PIPELINES
    - FEATURE_TWO_STEP_TERMINAL
    - FEATURE_AREA_LABEL_ROUTING
    - FEATURE_DISPOSITION_LOGGING
    - FEATURE_TASK_ARTIFACTS
    - FEATURE_RESOURCE_GOVERNANCE
    - FEATURE_OPENCLAW_HEALTH_COSTS
    - FEATURE_CRABTRAP_HONEYPOT
    - PILOT_PADDOCK_E2E
  disabled_or_absent:
    - PILOT_PRODUCT_LINE_A_E2E
    - FEATURE_TASK_CONTROL_PLANE
    - FEATURE_AGENT_RUNNER_SANDBOXES
governance_defaults:
  - identity: daily-token-budget
    notes: SPEC-009B:paddock:daily-token-budget
    policy_type: budget
    limit_kind: token
    limit_value: 1000000
    period: day
    timezone: America/Chicago
    enforcement: alert
    enabled: true
    default_template: false
  - identity: daily-usd-budget
    notes: SPEC-009B:paddock:daily-usd-budget
    policy_type: budget
    limit_kind: usd
    limit_value: 10
    period: day
    timezone: America/Chicago
    enforcement: alert
    enabled: true
    default_template: false
  - identity: wip-visibility-template
    notes: SPEC-009B:paddock:wip-visibility-template
    policy_type: wip_limit
    limit_kind: concurrent_tasks
    limit_value: 2
    period: null
    timezone: America/Chicago
    enforcement: alert
    enabled: false
    default_template: true
safety_policy:
  existing_target: refuse_unless_allow_existing
  allow_first_intake_blocking_governance: false
  config_owned_surfaces:
    - workspace_identity
    - department_projects
    - agent_assignments
    - workflow_contract_templates
    - feature_flags
    - governance_defaults
  preserved_surfaces:
    - tasks
    - task_evidence_read_model_state
    - issues
    - activities
    - histories
    - comments
    - notifications
    - dispositions
    - artifacts
    - quality_reviews
    - github_sync_state
    - governance_audit_rows
    - manual_workflow_templates
    - row_ids
    - creation_timestamps
    - task_status
    - task_github_linkage
    - task_lineage
    - project_ticket_counters
    - assignment_timestamps
    - workflow_use_counters
    - non_owned_feature_flags
  # These are blocked effects. Their presence here is negative safety policy, not run permission.
  blocked_side_effects:
    - product_line_b
    - github_mutation
    - task_creation
    - dispatch
    - claim
    - runner
    - sandbox
    - harness_adapter
    - auto_merge
    - speckit_setup_or_autopilot
