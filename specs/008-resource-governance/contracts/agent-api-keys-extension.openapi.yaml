openapi: 3.1.0
info:
  title: SPEC-008 — agent_api_keys Extension (Label-only)
  version: 1.0.0
  description: |
    SPEC-008 reuses the EXISTING `agent_api_keys` table without schema changes.
    No new `type` column; no new key-discrimination scheme (Constitution
    Principle XII). The collector's API key is identified by `key_label`
    convention `otelcol-contrib@<hostname>` per FR-090c. This document
    captures the LABEL convention + rotation semantics; the underlying
    create/list/rotate endpoints are unchanged from the upstream contract.
    Sources: spec.md FR-090c, FR-079b, Constitution Principle XII.
servers:
  - url: /api/agent-api-keys
paths:
  /:
    post:
      summary: Create a new API key (operator-only)
      description: |
        For SPEC-008 collector key, set `key_label` to `otelcol-contrib@<hostname>`
        and `role` to `operator`. The plaintext key is stored in 1Password as
        `op://<vault-name>/<collector-api-key-item>` and resolved at
        collector unit startup via systemd drop-in.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [key_label, role]
              properties:
                key_label:
                  type: string
                  description: |
                    For collector: `otelcol-contrib@<hostname>`
                    For operator UI: free-form label
                role:
                  type: string
                  enum: [operator, agent]
      responses:
        '201':
          description: Key created (plaintext returned ONCE)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [id, key_label, role, created_at, plaintext_key]
                properties:
                  id: { type: integer }
                  key_label: { type: string }
                  role: { type: string }
                  created_at: { type: string, format: date-time }
                  plaintext_key:
                    type: string
                    description: |
                      Returned ONCE on create; never echoed again. Caller
                      MUST persist (e.g., to 1Password); MC stores only the hash.
  /{id}/rotate:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
    post:
      summary: Rotate the API key (FR-090c)
      description: |
        On rotation, MC writes `governance_health_events(component='collector',
        state='degraded', detail='api_key_rotated')` until next successful ingest,
        then writes `('collector','healthy')`.
      responses:
        '200':
          description: Rotated
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [id, key_label, plaintext_key, health_event_id]
                properties:
                  id: { type: integer }
                  key_label: { type: string }
                  plaintext_key: { type: string }
                  health_event_id: { type: integer }
