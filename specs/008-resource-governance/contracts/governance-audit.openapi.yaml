openapi: 3.1.0
info:
  title: SPEC-008 Governance — Audit Chain (Read-only)
  version: 1.0.0
  description: |
    Read-only access to the tamper-evident audit chain.
    Sources: spec.md FR-176, FR-177, FR-184, FR-201, FR-273.
servers:
  - url: /api/governance
paths:
  /audit:
    get:
      summary: List audit-chain rows
      parameters:
        - in: query
          name: target_kind
          schema: { type: string }
        - in: query
          name: target_id
          schema: { type: string }
        - in: query
          name: kind
          schema: { type: string }
        - in: query
          name: from_ts
          schema: { type: string, format: date-time }
        - in: query
          name: to_ts
          schema: { type: string, format: date-time }
        - in: query
          name: cursor
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, default: 50, maximum: 200 }
      responses:
        '200':
          description: Audit page
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [rows]
                properties:
                  rows:
                    type: array
                    items: { $ref: '#/components/schemas/AuditRow' }
                  next_cursor: { type: string, nullable: true }
  /audit/verify:
    post:
      summary: Run on-demand integrity verification (FR-176, FR-177)
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                from_id: { type: integer }
                to_id: { type: integer }
      responses:
        '200':
          description: Verification result
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [verified, mismatches]
                properties:
                  verified: { type: boolean }
                  mismatches:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      properties:
                        id: { type: integer }
                        expected_hash: { type: string }
                        actual_hash: { type: string }
components:
  schemas:
    AuditRow:
      type: object
      additionalProperties: false
      required: [id, ts, actor_id, kind, target_kind, target_id, prev_hash, curr_hash]
      properties:
        id: { type: integer }
        ts: { type: string, format: date-time }
        actor_id: { type: string }
        actor_origin: { type: string }
        kind: { type: string }
        target_kind: { type: string }
        target_id: { type: string }
        before_json: { type: string }
        after_json: { type: string }
        prev_hash: { type: string }
        curr_hash: { type: string }
        workspace_id: { type: integer }
