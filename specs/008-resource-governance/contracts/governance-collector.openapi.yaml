openapi: 3.1.0
info:
  title: SPEC-008 Governance — Collector Config + Ingest Resume
  version: 1.0.0
  description: |
    Collector config audit trail (FR-090f) and per-source breaker-resume.
    Sources: spec.md FR-090f, FR-088, ingest/[source]/resume route.
servers:
  - url: /api/governance
paths:
  /collector/config:
    get:
      summary: Get current collector config + history
      responses:
        '200':
          description: Config + history
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [current, history]
                properties:
                  current:
                    type: object
                    additionalProperties: false
                    properties:
                      path: { type: string }
                      hash: { type: string }
                      modified_at: { type: string, format: date-time }
                      content_yaml: { type: string }
                  history:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      properties:
                        backup_path: { type: string }
                        hash: { type: string }
                        modified_at: { type: string, format: date-time }
    post:
      summary: Update collector config (FR-090f)
      description: |
        Snapshots the old config to `<DATA_DIR>/otelcol/config.<unix-ts>.yaml.bak`,
        writes the new config, then triggers `systemctl --user restart
        otelcol-contrib.service`. Two `governance_health_events` rows are written:
        first `('collector','restarting')`, then on next successful liveness
        probe `('collector','healthy')`.
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [content_yaml]
              properties:
                content_yaml: { type: string }
      responses:
        '200':
          description: Config updated; restart in progress
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [old_hash, new_hash, backup_path, restart_event_id]
                properties:
                  old_hash: { type: string }
                  new_hash: { type: string }
                  backup_path: { type: string }
                  restart_event_id: { type: integer }
        '422':
          description: Config validation failed (YAML or otelcol schema)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '429':
          description: Rate-limited per FR-203/Q68
          headers: { Retry-After: { schema: { type: integer } } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  /ingest/{source}/resume:
    parameters:
      - in: path
        name: source
        required: true
        schema:
          type: string
          enum: [native_otel, cli_stdout_json, transcript_replay, cli_mcp_serve, gateway_otel, codex_rollout, copilot_events, ollama_log, lm_studio_log, manual_post, provider_quota]
    post:
      summary: Reset per-source breaker (FR-088)
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                operator_acknowledged: { type: boolean, default: true }
      responses:
        '200':
          description: Source breaker reset; ingest_rate_state=healthy
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [source_id, prior_state, new_state, audit_id]
                properties:
                  source_id: { type: string }
                  prior_state: { type: string }
                  new_state: { type: string }
                  audit_id: { type: integer }
        '409':
          description: Source not in a resettable state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
components:
  schemas:
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error, retryable]
      properties:
        error: { type: string }
        reason: { type: string }
        retryable: { type: boolean, description: FR-214a }
        retry_after_ms: { type: integer }
        details:
          type: object
          additionalProperties: true
          description: For 412 follow FR-205a; for 422 follow FR-206a Zod-issue-tree.
