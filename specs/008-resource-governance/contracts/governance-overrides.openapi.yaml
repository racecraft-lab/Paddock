openapi: 3.1.0
info:
  title: SPEC-008 Governance — Override Grants
  version: 1.0.0
  description: |
    Operator-issued temporary overrides backed by atomic reservations.
    Concurrent grants resolve to exactly one 201 + N-1 deterministic 409.
    Sources: spec.md FR-171..185, AC-Race-1, FR-180.
servers:
  - url: /api/governance
paths:
  /overrides:
    get:
      summary: List active + recent overrides
      parameters:
        - in: query
          name: state
          schema: { type: string, enum: [active, consumed, released, expired, revoked] }
        - in: query
          name: workspace_id
          schema: { type: integer }
      responses:
        '200':
          description: Override list
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [rows]
                properties:
                  rows:
                    type: array
                    items: { $ref: '#/components/schemas/Override' }
    post:
      summary: Grant an override (atomic reservation; FR-054, FR-173)
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OverrideCreate' }
      responses:
        '201':
          description: Granted; reservation row created
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [override, reservation_id, remaining_budget_snapshot]
                properties:
                  override: { $ref: '#/components/schemas/Override' }
                  reservation_id: { type: integer }
                  remaining_budget_snapshot:
                    type: object
                    additionalProperties: false
                    required: [unit, remaining]
                    properties:
                      unit: { type: string }
                      remaining: { type: number }
        '409':
          description: Reservation unavailable (deterministic concurrent-loss path)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                example:
                  error: reservation_unavailable
                  reason: budget_concurrent
                  details: { remaining_usd: 0 }
        '412':
          description: ETag stale on the originating policy
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '422':
          description: Validation failed (TTL/amount sanity bounds per FR-179)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '423':
          description: Policy is locked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  /overrides/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
    get:
      responses:
        '200':
          description: Override
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Override' }
    delete:
      summary: Revoke an active override (FR-182)
      responses:
        '200':
          description: Revoked; reservation released
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Override' }
        '409':
          description: Already terminal
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
components:
  schemas:
    Override:
      type: object
      additionalProperties: false
      required: [id, reservation_id, originating_decision_id, granted_at, ttl_seconds, amount, unit, state]
      properties:
        id: { type: integer }
        reservation_id: { type: integer }
        originating_decision_id: { type: string }
        granted_by: { type: string }
        granted_at: { type: string, format: date-time }
        ttl_seconds: { type: integer }
        amount: { type: number }
        unit: { type: string }
        justification: { type: string }
        state:
          type: string
          enum: [active, consumed, released, expired, revoked]
        workspace_id: { type: integer }
    OverrideCreate:
      type: object
      additionalProperties: false
      required: [originating_decision_id, amount, unit, ttl_seconds, justification]
      properties:
        originating_decision_id: { type: string }
        amount: { type: number, exclusiveMinimum: 0 }
        unit: { type: string, enum: [usd, tokens_in, tokens_out, tokens_total, requests, sessions] }
        ttl_seconds: { type: integer, minimum: 60 }
        justification: { type: string, minLength: 1, maxLength: 2000 }
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error, retryable]
      properties:
        error: { type: string }
        reason: { type: string }
        retryable:
          type: boolean
          description: |
            FR-214a. true for 409 reservation_unavailable, 423, 429, 503; false otherwise.
        retry_after_ms:
          type: integer
          description: FR-203a. Suggested client backoff in milliseconds.
        details:
          type: object
          additionalProperties: true
          description: |
            For 422 follow FR-206a Zod-issue-tree shape; for 412 follow FR-205a
            (current_etag, current_version).
