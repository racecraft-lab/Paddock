openapi: 3.1.0
info:
  title: SPEC-008 Governance — Policies
  version: 1.0.0
  description: |
    CRUD and bulk-promote endpoints for `resource_policies`. Gated by
    `FEATURE_RESOURCE_GOVERNANCE` resolved via `resolveFlag(name, ctx)`.
    All mutating endpoints require operator role and ETag/If-Match.
    Sources: spec.md FR-031..050, FR-201, FR-205, FR-090h.
servers:
  - url: /api/governance
paths:
  /policies:
    get:
      summary: List policies
      parameters:
        - in: query
          name: scope
          schema: { type: string, enum: [agent, project, workspace, status, branch_pattern, label_pattern] }
        - in: query
          name: policy_type
          schema: { type: string, enum: [wip, budget, window, composite, aegis_emergency_reserve] }
        - in: query
          name: workspace_id
          schema: { type: integer }
      responses:
        '200':
          description: Page of policies
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PolicyList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
    post:
      summary: Create a new policy (in shadow mode by default per FR-037)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PolicyCreate' }
      responses:
        '201':
          description: Created
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Policy' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /policies/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
    get:
      responses:
        '200':
          description: Policy
          headers: { ETag: { schema: { type: string } } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Policy' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      summary: Update policy (requires If-Match)
      parameters:
        - in: header
          name: If-Match
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PolicyUpdate' }
      responses:
        '200':
          description: Updated
          headers: { ETag: { schema: { type: string } } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Policy' }
        '412': { $ref: '#/components/responses/EtagStale' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '423': { $ref: '#/components/responses/PolicyLocked' }
    delete:
      summary: Soft-disable a policy (sets disabled_at; never deletes rows)
      responses:
        '204': { description: Soft-disabled }
        '404': { $ref: '#/components/responses/NotFound' }
  /policies/{id}/promote:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
    post:
      summary: Promote a calibration template to a live policy (FR-041)
      parameters:
        - in: header
          name: If-Match
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                target_enforce_mode:
                  type: string
                  enum: [shadow, soft, hard]
              required: [target_enforce_mode]
      responses:
        '200':
          description: Promoted
          headers: { ETag: { schema: { type: string } } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Policy' }
        '409':
          description: Calibration milestones not yet met
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '412': { $ref: '#/components/responses/EtagStale' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /policies/bulk-promote:
    post:
      summary: Bulk-promote policies (FR-090h)
      description: |
        Single-workspace operation only; cross-workspace bulk-promote is
        forbidden in v1 (FR-090h) and returns 422 with
        `error: "cross_workspace_bulk_forbidden"`.
        Required `confirmation_phrase` MUST be the case-sensitive exact match
        of `PROMOTE TO SOFT` or `PROMOTE TO HARD`.
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [workspace_id, policy_ids, confirmation_phrase, target_enforce_mode]
              properties:
                workspace_id: { type: integer }
                policy_ids:
                  type: array
                  items: { type: integer }
                  minItems: 1
                  maxItems: 500
                confirmation_phrase:
                  type: string
                  enum: ['PROMOTE TO SOFT', 'PROMOTE TO HARD']
                target_enforce_mode:
                  type: string
                  enum: [soft, hard]
      responses:
        '200':
          description: Bulk promotion completed
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [affected_policy_ids, audit_id]
                properties:
                  affected_policy_ids:
                    type: array
                    items: { type: integer }
                  audit_id: { type: integer }
        '422':
          description: Validation failed (incl. cross_workspace_bulk_forbidden)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '409':
          description: One or more policies have stale etag or are locked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
components:
  schemas:
    Policy:
      type: object
      additionalProperties: false
      required: [id, scope, policy_type, enforce_mode, version, etag, created_at]
      properties:
        id: { type: integer }
        scope: { type: string }
        policy_type:
          type: string
          enum: [wip, budget, window, composite, aegis_emergency_reserve]
        limit_value: { type: number, nullable: true }
        window_spec_json: { type: string, nullable: true }
        enforce_mode:
          type: string
          enum: [shadow, soft, hard, dry_run]
        enabled_at: { type: string, format: date-time, nullable: true }
        disabled_at: { type: string, format: date-time, nullable: true }
        owner_workspace_id: { type: integer, nullable: true }
        version: { type: integer }
        etag: { type: string }
        priority_rank: { type: integer }
        notes: { type: string, nullable: true }
        policy_config_json: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        created_by: { type: string, nullable: true }
        updated_by: { type: string, nullable: true }
    PolicyCreate:
      allOf:
        - $ref: '#/components/schemas/Policy'
      required: [scope, policy_type, enforce_mode]
    PolicyUpdate:
      type: object
      additionalProperties: false
      properties:
        limit_value: { type: number }
        window_spec_json: { type: string }
        enforce_mode:
          type: string
          enum: [shadow, soft, hard, dry_run]
        notes: { type: string }
        policy_config_json: { type: string }
        priority_rank: { type: integer }
    PolicyList:
      type: object
      additionalProperties: false
      required: [rows]
      properties:
        rows:
          type: array
          items: { $ref: '#/components/schemas/Policy' }
        next_cursor: { type: string, nullable: true }
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error, retryable]
      properties:
        error: { type: string }
        reason: { type: string }
        retryable:
          type: boolean
          description: |
            FR-214a. Whether a naive client retry of the SAME request is expected to
            succeed. true for transient (409 reservation_unavailable, 423, 429, 503);
            false for client-correctable (401, 403, 404, 412 etag_stale, 413, 415, 422,
            400 protobuf_decode_failed, 409 idempotency_key_conflict). 412 is false because
            the client must GET the resource to refresh ETag/body before retrying.
        retry_after_ms:
          type: integer
          description: |
            FR-079a/FR-203a. Suggested client backoff in milliseconds when retryable=true.
            Mirrors the Retry-After header (which is in seconds per HTTP spec).
        details:
          type: object
          additionalProperties: true
          description: |
            Free-form per-error context. For 422 validation_failed bodies follow FR-206a
            Zod-issue-tree shape: { issues: [{ path: ["field", 0, "subfield"], code, message }, ...] }.
            For 412 etag_stale bodies follow FR-205a: { current_etag, current_version }.
            For 409 bulk_promote_partial_failure follow FR-090h-i:
              { failed_policy_ids: [...], reasons: { id: 'etag_stale'|'policy_locked'|'not_found' } }.
  responses:
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    ValidationFailed:
      description: Body validation failed (Zod) — field-level pointers
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    EtagStale:
      description: ETag mismatch (FR-180)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    PolicyLocked:
      description: Concurrent edit lock (FR-180)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    RateLimited:
      description: Per-actor rate limit exceeded (FR-203)
      headers:
        Retry-After: { schema: { type: integer } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
