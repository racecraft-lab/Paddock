openapi: 3.1.0
info:
  title: SPEC-008 Governance — Windows
  version: 1.0.0
  description: |
    Blackout/degraded window CRUD with IANA-tz aware materialization.
    Sources: spec.md FR-035, FR-036, FR-289, FR-290, FR-300.
servers:
  - url: /api/governance
paths:
  /windows:
    get:
      summary: List windows + their next-90-days materialized instances
      parameters:
        - in: query
          name: workspace_id
          schema: { type: integer }
        - in: query
          name: include_instances
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Windows
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [rows]
                properties:
                  rows:
                    type: array
                    items: { $ref: '#/components/schemas/WindowWithInstances' }
    post:
      summary: Create a window policy
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WindowCreate' }
      responses:
        '201':
          description: Created (instance materialization triggered)
          headers: { ETag: { schema: { type: string } } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WindowWithInstances' }
  /windows/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
    put:
      parameters:
        - in: header
          name: If-Match
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WindowUpdate' }
      responses:
        '200':
          description: Updated (instances regenerated)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WindowWithInstances' }
        '412':
          description: ETag stale
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    delete:
      responses:
        '204': { description: Soft-disabled }
components:
  schemas:
    WindowWithInstances:
      type: object
      additionalProperties: false
      required: [id, mode, iana_timezone, rule_cron, etag]
      properties:
        id: { type: integer }
        mode:
          type: string
          enum: [blackout, degraded]
        iana_timezone:
          type: string
          example: America/Chicago
        rule_cron:
          type: string
          description: Cron-like rule expressing the window
        allowed_classes_json:
          type: string
          description: JSON array (degraded mode only)
        etag: { type: string }
        next_instances:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [instance_start_utc, instance_end_utc, instance_local_label]
            properties:
              instance_start_utc: { type: string, format: date-time }
              instance_end_utc: { type: string, format: date-time }
              instance_local_label: { type: string }
    WindowCreate:
      type: object
      additionalProperties: false
      required: [mode, iana_timezone, rule_cron, owner_workspace_id]
      properties:
        mode: { type: string, enum: [blackout, degraded] }
        iana_timezone: { type: string }
        rule_cron: { type: string }
        allowed_classes_json: { type: string }
        owner_workspace_id: { type: integer }
    WindowUpdate:
      type: object
      additionalProperties: false
      properties:
        mode: { type: string, enum: [blackout, degraded] }
        iana_timezone: { type: string }
        rule_cron: { type: string }
        allowed_classes_json: { type: string }
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error, retryable]
      properties:
        error: { type: string }
        reason: { type: string }
        retryable:
          type: boolean
          description: FR-214a.
        retry_after_ms: { type: integer }
        details:
          type: object
          additionalProperties: true
          description: For 412 follow FR-205a; for 422 follow FR-206a Zod-issue-tree.
