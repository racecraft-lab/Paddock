openapi: 3.1.0
info:
  title: SPEC-008 OTLP Receiver
  version: 1.0.0
  description: |
    POST /api/otlp/v1/{traces,metrics} — OTLP/HTTP protobuf receiver.
    Authenticates via existing MC global API key (`x-api-key` or
    `Authorization: Bearer <key>`); reuses `extractApiKeyFromHeaders` from
    `src/lib/auth.ts:514-544` and `requireRole(req, 'operator')` from
    `src/lib/auth.ts:723-735`. NO new `agent_api_keys.type` column
    introduced (Constitution Principle XII).
    Sources: spec.md FR-079, FR-079a, FR-079b, FR-090b, FR-090c, FR-090e.
servers:
  - url: /api/otlp/v1
paths:
  /traces:
    post:
      summary: OTLP/HTTP traces ingest (FR-079a, FR-079b, FR-079c)
      requestBody:
        required: true
        content:
          application/x-protobuf:
            schema:
              type: string
              format: binary
              description: ExportTraceServiceRequest (OTLP/HTTP 1.10.0)
      parameters:
        - in: header
          name: x-api-key
          schema: { type: string }
          description: MC API key (alternative to Authorization)
        - in: header
          name: Authorization
          schema: { type: string }
          description: 'Bearer <MC API key> (alternative to x-api-key)'
      responses:
        '200':
          description: Accepted
          content:
            application/x-protobuf:
              schema:
                type: string
                format: binary
                description: ExportTraceServiceResponse
        '400':
          description: Protobuf decode failed (FR-079c — malformed/truncated/schema_mismatch/version_skew)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '401':
          description: Authentication required (FR-079a)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '405':
          description: Method not allowed (FR-079c) — only POST accepted; response includes Allow header
          headers:
            Allow: { schema: { type: string }, description: 'POST' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '413':
          description: Payload too large (>1 MiB decompressed per FR-079c gzip handling)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '415':
          description: Unsupported media type (FR-079c — Content-Type must be application/x-protobuf)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '429':
          description: Rate limited (10 fails / 60s OR ingest token-bucket exceeded)
          headers:
            Retry-After: { schema: { type: integer }, description: 'OTLP-spec retry semantics; 60000 ms' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '503':
          description: Service unavailable (disk_full_pause OR FR-208a feature_disabled when FEATURE_OPENCLAW_HEALTH_COSTS=false)
          headers:
            Retry-After: { schema: { type: integer } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  /metrics:
    post:
      summary: OTLP/HTTP metrics ingest (FR-079a, FR-079b, FR-079c)
      requestBody:
        required: true
        content:
          application/x-protobuf:
            schema:
              type: string
              format: binary
              description: ExportMetricsServiceRequest
      parameters:
        - in: header
          name: x-api-key
          schema: { type: string }
        - in: header
          name: Authorization
          schema: { type: string }
      responses:
        '200':
          description: Accepted
          content:
            application/x-protobuf:
              schema:
                type: string
                format: binary
        '400':
          description: Protobuf decode failed (FR-079c)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '401':
          description: Authentication required
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '405':
          description: Method not allowed (FR-079c)
          headers:
            Allow: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '413':
          description: Payload too large
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '415':
          description: Unsupported media type (FR-079c)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '429':
          description: Rate limited
          headers:
            Retry-After: { schema: { type: integer } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '503':
          description: Service unavailable (disk_full_pause OR FR-208a feature_disabled when FEATURE_OPENCLAW_HEALTH_COSTS=false)
          headers:
            Retry-After: { schema: { type: integer } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
components:
  schemas:
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error, retryable]
      properties:
        error: { type: string }
        reason: { type: string }
        retryable:
          type: boolean
          description: |
            FR-214a. true for 429 rate_limit and 503 service_unavailable; false for
            400 protobuf_decode_failed, 401, 405, 413, 415.
        retry_after_ms: { type: integer }
        details: { type: object, additionalProperties: true }
      examples:
        - error: 'Authentication required'
          retryable: false
        - error: 'protobuf_decode_failed'
          reason: 'malformed'
          retryable: false
        - error: 'unsupported_media_type'
          retryable: false
        - error: 'rate_limit'
          retry_after_ms: 60000
          retryable: true
        - error: 'payload_too_large'
          retryable: false
        - error: 'service_unavailable'
          reason: 'disk_full'
          retryable: true
        - error: 'service_unavailable'
          reason: 'feature_disabled'
          retryable: false
