openapi: 3.1.0
info:
  title: Mission Control Task Evidence API
  version: task_evidence.v1
paths:
  /api/tasks/{id}/evidence:
    get:
      summary: Read stored task-local evidence for an authorized task.
      description: >
        Returns a generic task evidence envelope with pilot-derived v1 sections.
        This endpoint is read-only and must not call GitHub, generate packets,
        run smoke scripts, trigger sync, mutate tasks, write activities, or
        parse smoke checklist Markdown at runtime.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: workspaceId
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Task evidence was derived from stored Mission Control evidence, including negative or incomplete domain states.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskEvidenceResponse"
        "400":
          description: Malformed workspace scope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthenticated read.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Authenticated caller is forbidden from an explicit workspace scope, following existing authorization behavior.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Masked missing task or task outside authorized workspace scope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: string
          examples: [task_not_found, unauthorized, forbidden, invalid_workspace_scope]
    EvidenceState:
      type: string
      enum:
        - eligible
        - not_eligible
        - incomplete
        - available
        - missing
        - stale
        - redacted
        - quarantined
        - superseded
        - unavailable
        - deferred
    TaskEvidenceResponse:
      type: object
      required:
        - schema_version
        - task
        - pilot_eligibility
        - identity
        - packet_artifacts
        - smoke
        - current_stage
        - warnings
        - deferrals
        - source_map
      additionalProperties: false
      properties:
        schema_version:
          type: string
          const: task_evidence.v1
        task:
          $ref: "#/components/schemas/TaskEvidenceTask"
        pilot_eligibility:
          $ref: "#/components/schemas/PilotEligibility"
        identity:
          $ref: "#/components/schemas/IdentityEvidence"
        packet_artifacts:
          $ref: "#/components/schemas/PacketArtifactsEvidence"
        smoke:
          $ref: "#/components/schemas/SmokeEvidence"
        current_stage:
          $ref: "#/components/schemas/CurrentStageEvidence"
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/EvidenceWarning"
        deferrals:
          type: array
          minItems: 7
          items:
            $ref: "#/components/schemas/DeferralEvidence"
        source_map:
          type: array
          items:
            $ref: "#/components/schemas/SourceMapEntry"
    TaskEvidenceTask:
      type: object
      required: [id, state]
      additionalProperties: false
      properties:
        id:
          type: string
        title:
          type: string
        status:
          type: string
        state:
          $ref: "#/components/schemas/EvidenceState"
        workspace_id:
          type: string
        github_repo:
          type: string
        github_issue_number:
          type: integer
        github_pr_number:
          type: integer
    PilotEligibility:
      type: object
      required: [state, reasons]
      additionalProperties: false
      properties:
        state:
          $ref: "#/components/schemas/EvidenceState"
        reasons:
          type: array
          items:
            type: string
        inputs:
          type: array
          items:
            type: string
    IdentityEvidence:
      type: object
      required: [state, missing]
      additionalProperties: false
      properties:
        state:
          $ref: "#/components/schemas/EvidenceState"
        repository:
          type: string
        issue:
          $ref: "#/components/schemas/GitHubReference"
        pull_request:
          $ref: "#/components/schemas/GitHubReference"
        missing:
          type: array
          items:
            type: string
    GitHubReference:
      type: object
      required: [number]
      additionalProperties: false
      properties:
        number:
          type: integer
        url:
          type: string
          format: uri
        label:
          type: string
    PacketArtifactsEvidence:
      type: object
      required: [state, references, missing]
      additionalProperties: false
      properties:
        state:
          $ref: "#/components/schemas/EvidenceState"
        references:
          type: array
          items:
            $ref: "#/components/schemas/ArtifactReference"
        missing:
          type: array
          items:
            type: string
    ArtifactReference:
      type: object
      required: [state, kind, display_name]
      additionalProperties: false
      properties:
        state:
          $ref: "#/components/schemas/EvidenceState"
        artifact_id:
          type: string
        kind:
          type: string
          enum: [packet_json, packet_markdown, source_map, smoke_reference, other]
        display_name:
          type: string
        sha256:
          type: string
        mime_type:
          type: string
        size_bytes:
          type: integer
        created_at:
          type: string
          format: date-time
        warning_codes:
          type: array
          items:
            type: string
    SmokeEvidence:
      type: object
      required: [state, references, missing]
      additionalProperties: false
      properties:
        state:
          $ref: "#/components/schemas/EvidenceState"
        references:
          type: array
          items:
            type: string
        missing:
          type: array
          items:
            type: string
    CurrentStageEvidence:
      type: object
      required: [state]
      additionalProperties: false
      properties:
        state:
          $ref: "#/components/schemas/EvidenceState"
        current_status:
          type: string
        activity_reference:
          type: string
        snapshot_status:
          type: string
        warnings:
          type: array
          items:
            type: string
    EvidenceWarning:
      type: object
      required: [code, message]
      additionalProperties: false
      properties:
        code:
          type: string
        message:
          type: string
        section:
          type: string
    DeferralEvidence:
      type: object
      required: [category, state, owner_spec, label]
      additionalProperties: false
      properties:
        category:
          type: string
          enum:
            - run_state
            - sync_automation
            - claim_authority
            - retry_debug_controls
            - sandbox_lifecycle
            - adapter_registry
            - real_harness_execution
        state:
          type: string
          const: deferred
        owner_spec:
          type: string
          enum: [SPEC-013A, SPEC-013A1, SPEC-013B, SPEC-013C, SPEC-014A-D]
        label:
          type: string
    SourceMapEntry:
      type: object
      required: [section, source_type, state]
      additionalProperties: false
      properties:
        section:
          type: string
        source_type:
          type: string
          enum:
            - task
            - activity
            - artifact
            - packet
            - quality_review
            - governance
            - github_sync
            - retained_github_issue
            - retained_github_pr
            - static_uat_link
            - cleanup_note
        source_id:
          type: string
        state:
          $ref: "#/components/schemas/EvidenceState"
        note:
          type: string
