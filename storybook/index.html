<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Storybook Visual Baselines</title>
    <style>
      body {
        margin: 0;
        background: #f6f7f9;
        color: #172026;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        width: min(760px, calc(100vw - 32px));
        margin: 0 auto;
        padding: 48px 0;
      }
      section {
        border: 1px solid #d7e0e5;
        border-radius: 8px;
        background: #fff;
        box-shadow: 0 18px 42px rgba(23, 32, 38, 0.08);
        padding: 28px;
      }
      h1 { margin: 0; font-size: clamp(1.5rem, 3vw, 2.25rem); line-height: 1.1; }
      p { color: #60707a; line-height: 1.55; }
      a { color: #006d77; font-weight: 750; text-decoration: none; }
      a:hover, a:focus-visible { text-decoration: underline; }
      .links { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 22px; }
      .button {
        display: inline-flex;
        min-height: 40px;
        align-items: center;
        border: 1px solid #aebdc5;
        border-radius: 7px;
        padding: 9px 13px;
      }
    </style>
  </head>
  <body>
    <main>
      <section>
        <h1>Storybook Visual Baselines</h1>
        <p>Published Storybook reports are stored in hash-named folders after main-branch workflow runs. Use PR workflow artifacts as the source of truth for active peer review.</p>
        <div class="links">
          <a class="button" href="../">Review hub</a>
          <a class="button" href="https://github.com/racecraft-lab/mission-control/actions/workflows/visual-storybook.yml">Workflow runs</a>
        </div>
      </section>
    </main>
  </body>
</html>
